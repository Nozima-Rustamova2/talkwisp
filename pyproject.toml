[project]
name = "talkwisp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.4",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    # Windows ships no IANA timezone database, so zoneinfo cannot resolve
    # Asia/Tashkent without this. It was installed transitively and worked
    # by luck; a fresh environment would have failed at the first date.
    "tzdata>=2026.3",
    "uvicorn[standard]>=0.52.4",
]
